  <script>
    // Mega menu tab switching
    document.querySelectorAll('.mega-menu-tab').forEach(function(tab) {
      tab.addEventListener('mouseenter', function() {
        var tabId = this.getAttribute('data-tab');
        document.querySelectorAll('.mega-menu-tab').forEach(function(t) { t.classList.remove('is-active'); });
        document.querySelectorAll('.mega-menu-tab-panel').forEach(function(p) { p.classList.remove('is-active'); });
        this.classList.add('is-active');
        var panel = document.getElementById('panel-' + tabId);
        if (panel) panel.classList.add('is-active');
      });
    });

    // Mega menu aria-expanded toggle
    var trigger = document.querySelector('.mega-menu-trigger');
    var wrapper = document.querySelector('.mega-menu-wrapper');
    if (trigger && wrapper) {
      wrapper.addEventListener('mouseenter', function() { trigger.setAttribute('aria-expanded', 'true'); });
      wrapper.addEventListener('mouseleave', function() { trigger.setAttribute('aria-expanded', 'false'); });
      trigger.addEventListener('focus', function() { trigger.setAttribute('aria-expanded', 'true'); });
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && trigger.getAttribute('aria-expanded') === 'true') {
          trigger.setAttribute('aria-expanded', 'false');
          trigger.focus();
        }
      });
    }

    // Scroll-triggered entry for marked elements
    (function () {
      var prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (prefersReduced || !('IntersectionObserver' in window)) {
        document.querySelectorAll('[data-reveal]').forEach(function (el) { el.classList.add('is-revealed'); });
        return;
      }
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-revealed');
            io.unobserve(entry.target);
          }
        });
      }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
      document.querySelectorAll('[data-reveal]').forEach(function (el) { io.observe(el); });
    })();

    // Animated count-up numbers
    (function () {
      var prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var els = document.querySelectorAll('[data-count-to]');
      if (!els.length) return;
      function format(val, decimals, prefix, suffix) {
        var n = decimals > 0 ? val.toFixed(decimals) : Math.round(val).toString();
        if (decimals === 0) {
          n = n.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        }
        return (prefix || '') + n + (suffix || '');
      }
      function animate(el) {
        var target = parseFloat(el.getAttribute('data-count-to'));
        var decimals = parseInt(el.getAttribute('data-count-decimals') || '0', 10);
        var prefix = el.getAttribute('data-count-prefix') || '';
        var suffix = el.getAttribute('data-count-suffix') || '';
        if (prefersReduced || isNaN(target)) {
          el.textContent = format(target, decimals, prefix, suffix);
          return;
        }
        var duration = 1400;
        var start = performance.now();
        function tick(now) {
          var t = Math.min(1, (now - start) / duration);
          var eased = 1 - Math.pow(1 - t, 3);
          el.textContent = format(target * eased, decimals, prefix, suffix);
          if (t < 1) requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      }
      if (!('IntersectionObserver' in window)) {
        els.forEach(animate);
        return;
      }
      var countIo = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            animate(entry.target);
            countIo.unobserve(entry.target);
          }
        });
      }, { threshold: 0.4 });
      els.forEach(function (el) { countIo.observe(el); });
    })();

    // Timeline activation
    (function () {
      var timelines = document.querySelectorAll('[data-timeline]');
      if (!timelines.length) return;
      if (!('IntersectionObserver' in window)) {
        timelines.forEach(function (t) { t.classList.add('is-active'); });
        return;
      }
      var tio = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-active');
            tio.unobserve(entry.target);
          }
        });
      }, { threshold: 0.25 });
      timelines.forEach(function (t) { tio.observe(t); });
    })();

    // Before/after compare slider
    (function () {
      var containers = document.querySelectorAll('.compare');
      if (!containers.length) return;
      containers.forEach(function (c) {
        var handle = c.querySelector('.compare-handle');
        if (!handle) return;
        var isDragging = false;
        function setPos(pct) {
          pct = Math.max(0, Math.min(100, pct));
          c.style.setProperty('--compare-pos', pct + '%');
          handle.setAttribute('aria-valuenow', Math.round(pct));
        }
        function fromClientX(x) {
          var rect = c.getBoundingClientRect();
          setPos(((x - rect.left) / rect.width) * 100);
        }
        function onDown(e) {
          isDragging = true;
          c.style.cursor = 'ew-resize';
          if (e.touches) fromClientX(e.touches[0].clientX);
          else fromClientX(e.clientX);
          e.preventDefault();
        }
        function onMove(e) {
          if (!isDragging) return;
          if (e.touches) fromClientX(e.touches[0].clientX);
          else fromClientX(e.clientX);
        }
        function onUp() { isDragging = false; c.style.cursor = ''; }
        handle.addEventListener('mousedown', onDown);
        handle.addEventListener('touchstart', onDown, { passive: false });
        window.addEventListener('mousemove', onMove);
        window.addEventListener('touchmove', onMove, { passive: true });
        window.addEventListener('mouseup', onUp);
        window.addEventListener('touchend', onUp);
        c.addEventListener('click', function (e) {
          if (e.target === handle || handle.contains(e.target)) return;
          fromClientX(e.clientX);
        });
        handle.addEventListener('keydown', function (e) {
          var current = parseFloat(handle.getAttribute('aria-valuenow')) || 50;
          var step = e.shiftKey ? 10 : 2;
          if (e.key === 'ArrowLeft') { setPos(current - step); e.preventDefault(); }
          else if (e.key === 'ArrowRight') { setPos(current + step); e.preventDefault(); }
          else if (e.key === 'Home') { setPos(0); e.preventDefault(); }
          else if (e.key === 'End') { setPos(100); e.preventDefault(); }
        });
      });
    })();

    // Contact form submission (real backend + mailto fallback so no lead is ever lost)
    (function () {
      var form = document.getElementById('contact-form');
      if (!form) return;
      var status = form.querySelector('.form-status');
      var btn = form.querySelector('[type="submit"]');
      var original = btn ? btn.textContent : '';

      // Get a free access key at https://web3forms.com (delivers to your inbox, no account/server needed).
      // Until a real key is set, the form falls back to opening the visitor's email client.
      var ACCESS_KEY = 'REPLACE_WITH_WEB3FORMS_ACCESS_KEY';
      var FALLBACK_EMAIL = 'info@explorationsites.com';

      function setStatus(msg, ok) {
        if (!status) return;
        status.hidden = false;
        status.textContent = msg;
        status.classList.toggle('is-error', !ok);
        status.classList.toggle('is-ok', ok);
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var honeypot = form.querySelector('[name="_gotcha"]');
        if (honeypot && honeypot.value) return; // bot
        if (typeof form.reportValidity === 'function' && !form.reportValidity()) return;

        var data = new FormData(form);

        // Fallback: no key configured -> open the visitor's email client, prefilled.
        if (!ACCESS_KEY || ACCESS_KEY.indexOf('REPLACE_WITH') === 0) {
          var subject = 'Project inquiry — ' + (data.get('name') || 'Website');
          var body = 'Name: ' + (data.get('name') || '') +
            '\nCompany: ' + (data.get('company') || '') +
            '\nEmail: ' + (data.get('email') || '') +
            '\nService: ' + (data.get('service') || '') +
            '\n\n' + (data.get('message') || '');
          window.location.href = 'mailto:' + FALLBACK_EMAIL +
            '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
          setStatus('Opening your email app so you can send this to us…', true);
          return;
        }

        // Real async submission via Web3Forms.
        data.append('access_key', ACCESS_KEY);
        data.append('subject', 'New project inquiry from explorationsites.com');
        if (btn) { btn.disabled = true; btn.textContent = 'Sending…'; }
        if (status) status.hidden = true;

        fetch('https://api.web3forms.com/submit', {
          method: 'POST',
          headers: { 'Accept': 'application/json' },
          body: data
        })
          .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
          .then(function (res) {
            if (res.ok && res.j && res.j.success) {
              form.reset();
              setStatus('Thank you — your inquiry has been sent. We respond within one business day.', true);
              if (btn) btn.textContent = 'Sent';
            } else { throw new Error('submit failed'); }
          })
          .catch(function () {
            setStatus('Something went wrong. Please email info@explorationsites.com or call 604 688 9997.', false);
            if (btn) { btn.disabled = false; btn.textContent = original; }
          });
      });
    })();

    // Selected-work lightbox
    (function () {
      var lb = document.getElementById('work-lightbox');
      if (!lb) return;
      var img = lb.querySelector('.lightbox-img');
      var cap = lb.querySelector('.lightbox-cap');
      function open(full, caption, alt) {
        img.src = full; img.alt = alt || caption || '';
        cap.textContent = caption || '';
        lb.hidden = false; document.body.style.overflow = 'hidden';
      }
      function close() { lb.hidden = true; img.src = ''; document.body.style.overflow = ''; }
      document.querySelectorAll('[data-lightbox]').forEach(function (el) {
        el.addEventListener('click', function () {
          var thumb = el.querySelector('img');
          open(el.getAttribute('data-full'), el.getAttribute('data-caption'), thumb ? thumb.alt : '');
        });
      });
      lb.addEventListener('click', function (e) {
        if (e.target === lb || e.target.classList.contains('lightbox-close')) close();
      });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !lb.hidden) close(); });
    })();
  </script>
